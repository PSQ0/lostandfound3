<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{form.as_p}}

    {% if item.image %}
        <div>
            <label>تصویر فعلی:</label><br>
            <img src="{{item.image.url}}" alt="{{item.title}}">
        </div>
    {% endif %}

    <button type="submit"> update </button>
</form>
